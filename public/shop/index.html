<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1240">
  <title>JustGold Shop · JustGameBox</title>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/shop/shop.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <a class="back" id="back" href="/box/play" aria-label="Back">‹</a>
      <h1 id="title">JustGold Shop<small>Your character, in every game</small></h1>
      <span class="jg" id="jg" hidden aria-live="polite"></span>
    </header>
    <div class="jgp-shopstrip" data-progress-strip hidden></div> <!-- level + seasonal event (public/progress-ui.js; fills itself) -->
    <div id="start" hidden></div>
    <div class="left" id="left" hidden>
      <div class="busy" id="busy" hidden><span style="font-size:28px">🎮</span><div><b>You’re in a game right now</b>You can shop after this game. Have a look around!</div></div>
      <div class="offline" id="offline" hidden></div>
      <div class="acct" id="acct"></div> <!-- "Save your stuff" / "Saved as NAME ✓" (account-ui.js) -->
      <section class="stage" id="stage" aria-label="Your character">
        <div class="wall"></div>
        <canvas id="stage-cv"></canvas>
        <div class="tag" id="tag" hidden></div>
        <div class="bubble" id="bubble"></div>
        <div class="plate np-plain" id="plate"></div>
      </section>
    </div>
    <div class="right" id="right" hidden>
      <nav class="tabs" id="tabs" role="tablist"></nav>
      <nav class="subs" id="subs"></nav>
      <main class="shelf" id="shelf"></main>
    </div>
  </div>
  <div class="act off" id="act" aria-live="polite"></div>
  <div class="toast" id="toast" hidden></div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/haptics.js"></script>
  <script src="/account-ui.js"></script>
  <script src="/shared/options.js"></script>
  <script src="/shared/cosmetics.js"></script>
  <script src="/shared/gear.js"></script>
  <script src="/shared/seasons.js"></script>
  <script src="/shared/shop-season.js"></script>
  <script src="/avatar.js"></script><script src="/avatar-events.js"></script>
  <script src="/wear-art.js"></script>
  <script src="/farewell-art.js"></script>
  <script src="/box/portrait.js"></script>
  <script src="/box/audio.js"></script> <!-- the shop's music on a computer screen (shop.js) -->
  <script src="/shop/shop.js"></script>
  <script src="/shared/seasons.js"></script>
  <script src="/progress-ui.js"></script>
</body>
</html>
