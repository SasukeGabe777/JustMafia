      <stop offset="0.55" stop-color="#b0243e"/>
      <stop offset="1" stop-color="#3d0a14"/>
    </radialGradient>
    <linearGradient id="blackjack-rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4a26"/>
      <stop offset="1" stop-color="#3d1a0a"/>
    </linearGradient>
    <linearGradient id="blackjack-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf5"/>
      <stop offset="1" stop-color="#f0e2c4"/>
