<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="zombie-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a0c"/>
      <stop offset="1" stop-color="#1e3418"/>
    </linearGradient>
    <linearGradient id="zombie-shelfL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c3a1a"/>
      <stop offset="1" stop-color="#0c180b"/>
    </linearGradient>
    <linearGradient id="zombie-shelfR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#1c3a1a"/>
      <stop offset="1" stop-color="#0c180b"/>
    </linearGradient>
    <linearGradient id="zombie-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22301c"/>
      <stop offset="1" stop-color="#4a5a38"/>
    </linearGradient>
    <radialGradient id="zombie-endglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9dff5a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#9dff5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zombie-beam" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff6c0" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff6c0" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="zombie-skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a6d46e"/>
      <stop offset="1" stop-color="#5a8a3a"/>
    </linearGradient>
    <radialGradient id="zombie-vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.5" stop-color="#050a04" stop-opacity="0"/>
      <stop offset="1" stop-color="#050a04" stop-opacity="0.8"/>
    </radialGradient>
    <g id="zombie-hand">
      <path d="M-11 0 L-12 90 L12 90 L11 0 Z" fill="url(#zombie-skin)" stroke="#142a0c" stroke-width="4" stroke-linejoin="round"/>
      <g stroke="#142a0c" stroke-width="14" stroke-linecap="round" fill="none">
        <path d="M-10 -26 L-18 -50 M-3 -30 L-5 -58 M5 -30 L9 -56 M12 -24 L22 -44 M-12 -10 L-28 -22"/>
      </g>
      <g stroke="#94c862" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M-10 -26 L-18 -50 M-3 -30 L-5 -58 M5 -30 L9 -56 M12 -24 L22 -44 M-12 -10 L-28 -22"/>
      </g>
      <path d="M-15 2 C-19 -12 -18 -26 -14 -32 L15 -32 C18 -22 17 -8 12 2 Z" fill="url(#zombie-skin)" stroke="#142a0c" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-8 -22 C-4 -26 2 -26 6 -22" fill="none" stroke="#5a8a3a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-13 30 L-16 46 L-8 40 L-2 50 L4 40 L10 48 L15 32 L14 90 L-14 90 Z" fill="#4a3a6a" stroke="#1b1030" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="400" height="240" fill="url(#zombie-bg)"/>
  <!-- back wall + glow -->
  <rect x="170" y="74" width="60" height="44" fill="#2a4a20"/>
  <circle cx="200" cy="96" r="70" fill="url(#zombie-endglow)"/>
  <rect x="186" y="80" width="28" height="10" rx="3" fill="#9dff5a" stroke="#0c180b" stroke-width="2"/>
  <!-- ceiling lights -->
  <g fill="#c8ff9e" stroke="#0c180b" stroke-width="2">
    <path d="M180 64 L220 64 L222 68 L178 68 Z"/>
    <path d="M168 44 L232 44 L236 52 L164 52 Z"/>
    <path d="M150 14 L250 14 L258 28 L142 28 Z"/>
  </g>
  <!-- floor -->
  <path d="M0 216 L170 118 L230 118 L400 216 L400 240 L0 240 Z" fill="url(#zombie-floor)"/>
  <path d="M200 118 L200 240 M185 118 L100 240 M215 118 L300 240" stroke="#0c180b" stroke-width="2" opacity="0.5"/>
  <ellipse cx="200" cy="150" rx="40" ry="8" fill="#9dff5a" opacity="0.18"/>
  <!-- left shelves -->
  <path d="M0 8 L170 74 L170 118 L0 216 Z" fill="url(#zombie-shelfL)" stroke="#060c05" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#9dff5a" stroke-width="4" stroke-linecap="round">
    <path d="M0 60 L170 85 M0 112 L170 96 M0 164 L170 107"/>
  </g>
  <g stroke="#060c05" stroke-width="2.5" stroke-linejoin="round">
    <path d="M10 30 L34 34 L34 58 L10 56 Z" fill="#d94a3a"/>
    <path d="M40 38 L58 40 L58 63 L40 61 Z" fill="#ffd34a"/>
    <path d="M70 44 L84 46 L84 66 L70 64 Z" fill="#4a8cff"/>
    <path d="M100 50 L112 52 L112 70 L100 68 Z" fill="#ff8a4d"/>
    <path d="M12 82 L36 82 L36 108 L12 110 Z" fill="#5ae0ff"/>
    <path d="M46 84 L66 84 L66 104 L46 106 Z" fill="#d94a3a"/>
    <path d="M82 88 L98 88 L98 101 L82 102 Z" fill="#ffd34a"/>
    <path d="M14 136 L40 132 L40 156 L14 160 Z" fill="#ffd34a"/>
    <path d="M50 130 L70 127 L70 148 L50 151 Z" fill="#b388ff"/>
  </g>
  <!-- right shelves -->
  <path d="M400 8 L230 74 L230 118 L400 216 Z" fill="url(#zombie-shelfR)" stroke="#060c05" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#9dff5a" stroke-width="4" stroke-linecap="round">
    <path d="M400 60 L230 85 M400 112 L230 96 M400 164 L230 107"/>
  </g>
  <g stroke="#060c05" stroke-width="2.5" stroke-linejoin="round">
    <path d="M390 30 L366 34 L366 58 L390 56 Z" fill="#4a8cff"/>
    <path d="M360 38 L342 40 L342 63 L360 61 Z" fill="#d94a3a"/>
    <path d="M330 44 L316 46 L316 66 L330 64 Z" fill="#ffd34a"/>
    <path d="M300 50 L288 52 L288 70 L300 68 Z" fill="#5ae0ff"/>
    <path d="M388 82 L364 82 L364 108 L388 110 Z" fill="#ff8a4d"/>
    <path d="M354 84 L334 84 L334 104 L354 106 Z" fill="#4a8cff"/>
    <path d="M318 88 L302 88 L302 101 L318 102 Z" fill="#d94a3a"/>
    <path d="M386 136 L360 132 L360 156 L386 160 Z" fill="#b388ff"/>
    <path d="M350 130 L330 127 L330 148 L350 151 Z" fill="#ffd34a"/>
  </g>
  <!-- tipped can -->
  <g transform="translate(232 196) rotate(80)" stroke="#060c05" stroke-width="3" stroke-linejoin="round">
    <rect x="-9" y="-12" width="18" height="24" rx="3" fill="#d94a3a"/>
    <rect x="-9" y="-4" width="18" height="8" fill="#ffd34a"/>
  </g>
  <!-- flashlight beam -->
  <path d="M400 214 L400 240 L176 128 L196 96 Z" fill="url(#zombie-beam)"/>
  <ellipse cx="192" cy="112" rx="22" ry="18" fill="#fff6c0" opacity="0.35"/>
  <!-- hands rising -->
  <ellipse cx="200" cy="200" rx="120" ry="10" fill="#000" opacity="0.4"/>
  <use href="#zombie-hand" transform="translate(196 156) scale(0.7)"/>
  <use href="#zombie-hand" transform="translate(128 160) rotate(-14)"/>
  <use href="#zombie-hand" transform="translate(268 164) rotate(12) scale(-0.95 0.95)"/>
  <!-- drips / glow motes -->
  <g fill="#9dff5a" opacity="0.7">
    <circle cx="96" cy="128" r="3"/><circle cx="300" cy="120" r="2.5"/><circle cx="160" cy="98" r="2"/><circle cx="246" cy="104" r="2"/>
  </g>
  <rect width="400" height="240" fill="url(#zombie-vig)"/>
</svg>
