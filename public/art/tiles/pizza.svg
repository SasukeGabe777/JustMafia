    <path d="M262 112 L300 112 L281 178Z" fill="url(#yc-waffle)" stroke="none" opacity=".5"/>
    <path d="M258 112 A23 23 0 1 1 304 112 L298 118 L292 112 L286 120 L280 112 L272 119 L266 112Z" fill="#ff9ab0"/>
    <path d="M262 90 A19 19 0 1 1 300 90 L294 96 L288 90 L282 98 L276 90 L270 97Z" fill="#a8ecc8"/>
    <path d="M268 74 Q262 64 274 62 Q272 52 282 54 Q284 44 290 50 Q298 50 296 60 Q304 64 296 74Z" fill="#ffffff"/>
