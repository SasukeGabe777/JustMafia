    <path d="M98 112 Q126 102 152 114 L128 166Z" fill="#c8321f" stroke="none"/>
    <path d="M100 114 Q126 106 150 116 L128 160Z" fill="#ffd968" stroke="none"/>
    <circle cx="118" cy="124" r="6" fill="#b3261b" stroke-width="1.6"/><circle cx="136" cy="128" r="6" fill="#b3261b" stroke-width="1.6"/><circle cx="127" cy="146" r="5.5" fill="#b3261b" stroke-width="1.6"/>
