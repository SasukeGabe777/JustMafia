    <rect x="156" y="146" width="88" height="15" rx="7.5" fill="#6b3a1f"/>
    <path d="M154 146 L246 146 L240 154 L226 152 L218 162 L210 152 L180 152 L172 164 L164 152 L156 154Z" fill="#ffc93c"/>
    <path d="M150 140 L158 146 L166 138 L174 146 L182 138 L190 146 L198 138 L206 146 L214 138 L222 146 L230 138 L238 146 L246 138 L250 142 L248 132 L152 132Z" fill="#6fc24a"/>
