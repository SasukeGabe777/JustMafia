  </g>
  <g fill="#fff6dc" stroke="#b8925a" stroke-width=".7"><ellipse cx="180" cy="102" rx="3.4" ry="1.8" transform="rotate(-20 180 102)"/><ellipse cx="200" cy="96" rx="3.4" ry="1.8"/><ellipse cx="220" cy="104" rx="3.4" ry="1.8" transform="rotate(25 220 104)"/><ellipse cx="192" cy="112" rx="3.4" ry="1.8" transform="rotate(40 192 112)"/><ellipse cx="212" cy="114" rx="3.4" ry="1.8" transform="rotate(-35 212 114)"/></g>
  <path d="M168 110 Q178 94 198 92" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".45"/>
