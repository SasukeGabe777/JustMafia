<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
  <!-- YesChef: the food court at night. String lights over the stalls; on the counter a burger, a slice of pizza, a taco, sushi and a sundae. -->
  <defs>
    <linearGradient id="yc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14103a"/><stop offset=".6" stop-color="#3a2470"/><stop offset="1" stop-color="#5a3080"/></linearGradient>
    <radialGradient id="yc-lamp" cx="50%" cy="35%" r="60%"><stop offset="0" stop-color="#ffd9a0" stop-opacity=".55"/><stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/></radialGradient>
    <linearGradient id="yc-counter" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f1ea"/><stop offset="1" stop-color="#d4cbe4"/></linearGradient>
    <linearGradient id="yc-bun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2b25a"/><stop offset="1" stop-color="#d4862e"/></linearGradient>
    <linearGradient id="yc-cone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b868"/><stop offset="1" stop-color="#c8843a"/></linearGradient>
    <pattern id="yc-waffle" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0H10M0 0V10" stroke="#a8642a" stroke-width="1.6"/></pattern>
  </defs>
  <rect width="400" height="240" fill="url(#yc-sky)"/>
  <g fill="#fff8e0" opacity=".7"><circle cx="40" cy="20" r="1.4"/><circle cx="120" cy="12" r="1"/><circle cx="300" cy="18" r="1.3"/><circle cx="360" cy="10" r="1"/><circle cx="250" cy="8" r="1"/></g>
  <!-- the stalls in the back -->
  <g stroke="#1a0f30" stroke-width="3">
    <rect x="-10" y="70" width="110" height="110" fill="#8a3a1f"/><rect x="104" y="70" width="96" height="110" fill="#1fa596"/><rect x="204" y="70" width="96" height="110" fill="#c49a6a"/><rect x="304" y="70" width="110" height="110" fill="#ffd6e7"/>
  </g>
  <g stroke="#1a0f30" stroke-width="2.4">
    <path d="M-10 62 H100 V78 Q91 88 82 78 Q73 88 64 78 Q55 88 46 78 Q37 88 28 78 Q19 88 10 78 Q1 88 -10 78Z" fill="#c8321f"/>
    <path d="M104 62 H200 V78 Q192 88 184 78 Q176 88 168 78 Q160 88 152 78 Q144 88 136 78 Q128 88 120 78 Q112 88 104 78Z" fill="#ffd23f"/>
    <path d="M204 62 H300 V78 Q292 88 284 78 Q276 88 268 78 Q260 88 252 78 Q244 88 236 78 Q228 88 220 78 Q212 88 204 78Z" fill="#24345e"/>
    <path d="M304 62 H414 V78 Q404 88 394 78 Q384 88 374 78 Q364 88 354 78 Q344 88 334 78 Q324 88 314 78 Q309 84 304 78Z" fill="#ff8fc8"/>
  </g>
  <rect width="400" height="240" fill="url(#yc-lamp)"/>
