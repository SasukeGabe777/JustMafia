    <circle cx="112" cy="160" r="4" fill="#ffffff" stroke-width="1.2"/><circle cx="126" cy="154" r="4" fill="#4cbb5a" stroke-width="1.2"/><circle cx="140" cy="158" r="4" fill="#ffd23f" stroke-width="1.2"/><circle cx="152" cy="163" r="3.6" fill="#7ac943" stroke-width="1.2"/>
    <path d="M98 170 A33 24 0 0 0 164 170Z" fill="#f2c14e"/>
  </g>
  <!-- sushi in front, right -->
  <g stroke="#2a160c" stroke-width="2.4">
    <rect x="206" y="174" width="64" height="8" rx="3" fill="#e0b070"/>
    <circle cx="223" cy="164" r="12" fill="#1f2d1f"/><circle cx="223" cy="164" r="9" fill="#fbfaf5" stroke="none"/><rect x="219" y="160" width="8" height="8" rx="2" fill="#ff8c5a" stroke-width="1.2"/>
    <circle cx="252" cy="164" r="12" fill="#1f2d1f"/><circle cx="252" cy="164" r="9" fill="#fbfaf5" stroke="none"/><rect x="248" y="160" width="8" height="8" rx="2" fill="#c8243c" stroke-width="1.2"/>
  </g>
  <g fill="#ff7a1a" stroke="#8a3a0a" stroke-width=".6"><circle cx="249" cy="152" r="2.4"/><circle cx="254" cy="151" r="2.4"/><circle cx="252" cy="155" r="2.4"/></g>
</svg>
