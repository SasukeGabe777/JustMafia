  <rect x="-10" y="192" width="420" height="60" fill="#3a2a5a"/>
  <g opacity=".9"><rect x="0" y="198" width="40" height="8" fill="#ffd23f"/><rect x="40" y="198" width="40" height="8" fill="#ff4f6d"/><rect x="80" y="198" width="40" height="8" fill="#3ad0ff"/><rect x="120" y="198" width="40" height="8" fill="#7ac943"/><rect x="160" y="198" width="40" height="8" fill="#ff8fc8"/><rect x="200" y="198" width="40" height="8" fill="#ffd23f"/><rect x="240" y="198" width="40" height="8" fill="#ff4f6d"/><rect x="280" y="198" width="40" height="8" fill="#3ad0ff"/><rect x="320" y="198" width="40" height="8" fill="#7ac943"/><rect x="360" y="198" width="40" height="8" fill="#ff8fc8"/></g>
