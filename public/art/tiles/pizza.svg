  <path d="M0 30 Q100 58 200 32 Q300 6 400 34" fill="none" stroke="#120a24" stroke-width="2"/>
  <g stroke="#120a24" stroke-width="1"><circle cx="22" cy="36" r="4" fill="#ffd23f"/><circle cx="62" cy="45" r="4" fill="#ff8fc8"/><circle cx="102" cy="48" r="4" fill="#7ad0ff"/><circle cx="142" cy="44" r="4" fill="#ffd23f"/><circle cx="182" cy="36" r="4" fill="#ff6b4a"/><circle cx="222" cy="27" r="4" fill="#7ac943"/><circle cx="262" cy="20" r="4" fill="#ffd23f"/><circle cx="302" cy="18" r="4" fill="#ff8fc8"/><circle cx="342" cy="22" r="4" fill="#7ad0ff"/><circle cx="382" cy="31" r="4" fill="#ffd23f"/></g>
