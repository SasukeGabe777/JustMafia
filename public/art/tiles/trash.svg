<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
  <!-- JustZombies: an isometric corner of town at dusk. A garage door rolls up and light spills onto the
       driveway; a crowd of zombies shambles in from the crossroads, one already down in a pool of goo.
       Original art for JustGameBox (in the style of the game's iso view). -->
  <defs>
    <linearGradient id="jz-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24163a"/>
      <stop offset="0.55" stop-color="#6b3550"/>
      <stop offset="1" stop-color="#e0794a"/>
    </linearGradient>
    <linearGradient id="jz-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffb35a" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="jz-pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe2a0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe2a0" stop-opacity="0"/>
    </radialGradient>
    <g id="jz-z">
      <ellipse cx="0" cy="0" rx="9" ry="3.5" fill="#000" opacity="0.35"/>
      <path d="M-4 0 L-3 -12 L3 -12 L4 0 Z" fill="#2f3a4a"/>
      <path d="M-6 -12 L6 -12 L5 -26 L-5 -26 Z" fill="#5a4a6a" stroke="#1b1410" stroke-width="1.2"/>
      <path d="M4 -24 L14 -22" stroke="#8fbf7a" stroke-width="3" stroke-linecap="round"/>
      <path d="M3 -20 L13 -17" stroke="#8fbf7a" stroke-width="3" stroke-linecap="round"/>
      <circle cx="1" cy="-31" r="6" fill="#8fbf7a" stroke="#1b1410" stroke-width="1.2"/>
      <circle cx="3.5" cy="-32" r="1.4" fill="#ff3a2a"/>
    </g>
  </defs>
  <rect width="400" height="240" fill="url(#jz-sky)"/>
  <!-- far rooftops -->
  <path d="M0 120 L30 104 L60 116 L90 96 L130 116 L160 100 L200 118 L240 98 L280 112 L320 94 L360 110 L400 96 L400 140 L0 140 Z" fill="#2a1830"/>
  <rect x="96" y="102" width="4" height="5" fill="#ffd98a" opacity="0.7"/><rect x="246" y="104" width="4" height="5" fill="#ffd98a" opacity="0.7"/><rect x="326" y="100" width="4" height="5" fill="#ffd98a" opacity="0.6"/>
  <!-- the ground: a lawn diamond, the iso crossroads -->
  <path d="M-40 150 L200 30 L440 150 L200 270 Z" fill="#4f7a3e"/>
  <path d="M-40 190 L280 30 L360 70 L40 230 Z" fill="#3a3c3f"/>
  <path d="M60 30 L400 200 L320 240 L-20 70 Z" fill="#3a3c3f"/>
  <path d="M-30 186 L282 30" stroke="#8f8b83" stroke-width="6"/>
  <path d="M30 228 L364 62" stroke="#8f8b83" stroke-width="6"/>
  <path d="M40 210 L320 70" stroke="#c9a43a" stroke-width="2" stroke-dasharray="14 10"/>
  <path d="M30 60 L360 225" stroke="#d8d6cc" stroke-width="2" stroke-dasharray="12 10" opacity="0.7"/>
  <!-- the garage (an iso box with a pitched roof), its door rolled half up -->
  <path d="M170 92 L250 52 L310 82 L230 122 Z" fill="#c9b79a"/>
  <path d="M170 92 L230 122 L230 172 L170 142 Z" fill="#c9b79a" stroke="#3a2e24" stroke-width="2"/>
  <path d="M230 122 L310 82 L310 132 L230 172 Z" fill="#a8957a" stroke="#3a2e24" stroke-width="2"/>
  <path d="M164 92 L240 54 L276 42 L200 80 Z" fill="#5b3a32" stroke="#2a1a16" stroke-width="2"/>
  <path d="M164 92 L200 80 L236 122 L230 126 Z" fill="#6b4438" stroke="#2a1a16" stroke-width="2"/>
  <path d="M236 122 L200 80 L276 42 L316 82 Z" fill="#5b3a32" stroke="#2a1a16" stroke-width="2"/>
  <path d="M178 112 L222 134 L222 166 L178 144 Z" fill="url(#jz-glow)"/>
  <path d="M178 112 L222 134 L222 146 L178 124 Z" fill="#c9ccd1" stroke="#6c7178" stroke-width="1.2"/>
  <path d="M178 118 L222 140" stroke="#8a8f98" stroke-width="1"/>
  <ellipse cx="180" cy="178" rx="58" ry="22" fill="url(#jz-pool)"/>
  <!-- you, stepping out, blaster up -->
  <ellipse cx="196" cy="168" rx="9" ry="3.5" fill="#000" opacity="0.4"/>
  <path d="M191 168 L192 156 L200 156 L201 168 Z" fill="#2f3440"/>
  <path d="M189 156 L203 156 L202 142 L190 142 Z" fill="#ffd23f" stroke="#1b1410" stroke-width="1.3"/>
  <circle cx="196" cy="134" r="9" fill="#f2c9a0" stroke="#1b1410" stroke-width="1.3"/>
  <path d="M187 131 Q196 118 205 131 Q200 126 196 128 Q191 126 187 131 Z" fill="#8a4ad0"/>
  <path d="M200 148 L172 156" stroke="#2b2f36" stroke-width="4" stroke-linecap="round"/>
  <path d="M170 157 L158 158 L170 151 Z" fill="#ffe28a"/>
  <!-- the crowd from the crossroads -->
  <use href="#jz-z" transform="translate(120 176) scale(-1 1)"/>
  <use href="#jz-z" transform="translate(96 160) scale(-0.9 0.9)"/>
  <use href="#jz-z" transform="translate(140 196) scale(-1.1 1.1)"/>
  <use href="#jz-z" transform="translate(70 186) scale(-1 1)"/>
  <use href="#jz-z" transform="translate(52 158) scale(-0.8 0.8)"/>
  <use href="#jz-z" transform="translate(300 196) scale(1.1 1.1)"/>
  <use href="#jz-z" transform="translate(330 176) scale(0.9 0.9)"/>
  <!-- one down, in a pool of goo -->
  <ellipse cx="150" cy="150" rx="16" ry="6" fill="#4a7a2a" opacity="0.85"/>
  <path d="M140 148 L160 146 L161 151 L141 153 Z" fill="#5a4a6a" stroke="#1b1410" stroke-width="1"/>
  <circle cx="162" cy="148" r="4.5" fill="#8fbf7a" stroke="#1b1410" stroke-width="1"/>
  <!-- a burnt-out car on the corner -->
  <path d="M260 186 L292 170 L318 183 L286 199 Z" fill="#6a3a2a" stroke="#1b1410" stroke-width="1.5"/>
  <path d="M260 186 L286 199 L286 207 L260 194 Z" fill="#4a2a20"/>
  <path d="M286 199 L318 183 L318 191 L286 207 Z" fill="#3a221a"/>
  <path d="M272 184 L292 174 L304 180 L284 190 Z" fill="#1c2630"/>
</svg>
