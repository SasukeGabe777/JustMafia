<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
  <!-- JustZombies: a garage door rolled half up at dusk, light spilling out; a zombie with a
       trash-can helmet shambles past a dented bin. Original art for JustGameBox. -->
  <defs>
    <linearGradient id="tz-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#24163a"/><stop offset="0.6" stop-color="#6b3550"/><stop offset="1" stop-color="#e0794a"/></linearGradient>
    <linearGradient id="tz-road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3a3f"/><stop offset="1" stop-color="#18161b"/></linearGradient>
    <linearGradient id="tz-glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a8" stop-opacity="0.75"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></linearGradient>
    <linearGradient id="tz-door" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9aa0a8"/><stop offset="1" stop-color="#d6d8dc"/></linearGradient>
    <linearGradient id="tz-can" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a8590"/><stop offset="0.5" stop-color="#c9ced6"/><stop offset="1" stop-color="#6c7884"/></linearGradient>
  </defs>
  <rect width="400" height="240" fill="url(#tz-sky)"/>
  <circle cx="330" cy="46" r="18" fill="#ffe9a8"/>
  <g fill="#2a1830"><rect x="0" y="92" width="40" height="70"/><rect x="44" y="110" width="30" height="52"/><rect x="300" y="100" width="36" height="62"/><rect x="340" y="84" width="60" height="78"/></g>
  <rect y="160" width="400" height="80" fill="url(#tz-road)"/>
  <g fill="#ffd23f"><rect x="10" y="205" width="40" height="5"/><rect x="90" y="205" width="40" height="5"/><rect x="250" y="205" width="40" height="5"/><rect x="330" y="205" width="40" height="5"/></g>
  <!-- the garage -->
  <path d="M84 72 L162 40 L240 72 Z" fill="#3b2420" stroke="#1b1410" stroke-width="5" stroke-linejoin="round"/>
  <rect x="92" y="70" width="140" height="94" fill="#5a3a32" stroke="#1b1410" stroke-width="5"/>
  <rect x="104" y="82" width="116" height="82" fill="#ffe9a8"/>
  <path d="M104 164 L220 164 L262 214 L64 214 Z" fill="url(#tz-glow)"/>
  <rect x="104" y="82" width="116" height="42" fill="url(#tz-door)" stroke="#1b1410" stroke-width="4"/>
  <g stroke="#7a7f86" stroke-width="3"><line x1="104" y1="94" x2="220" y2="94"/><line x1="104" y1="106" x2="220" y2="106"/><line x1="104" y1="118" x2="220" y2="118"/></g>
  <rect x="148" y="120" width="28" height="5" fill="#4a4f56"/>
  <!-- a survivor silhouette in the doorway, blaster ready -->
  <g fill="#1b1410"><circle cx="150" cy="134" r="8"/><rect x="143" y="141" width="14" height="17" rx="3"/><rect x="143" y="157" width="5" height="9"/><rect x="152" y="157" width="5" height="9"/><rect x="154" y="145" width="22" height="5" rx="2"/></g>
  <!-- the dented bin -->
  <g stroke="#1b1410" stroke-width="4" stroke-linejoin="round">
    <path d="M250 128 L282 128 L279 176 L253 176 Z" fill="#3d7a4a"/>
    <rect x="245" y="120" width="42" height="9" rx="3" fill="#2f6a3c"/>
  </g>
  <path d="M258 140 l6 4 l-3 6" stroke="#1b1410" stroke-width="2.5" fill="none"/>
  <!-- the trash-can-head zombie -->
  <g stroke="#1b1410" stroke-linejoin="round" stroke-linecap="round">
    <path d="M300 178 L296 154 M312 178 L316 154" stroke-width="7"/>
    <rect x="288" y="112" width="34" height="46" rx="7" fill="#4a3a5a" stroke-width="4"/>
    <path d="M292 122 L262 116 M292 132 L264 132" stroke-width="8"/>
    <path d="M292 122 L262 116 M292 132 L264 132" stroke="#7fae6a" stroke-width="4"/>
    <rect x="286" y="74" width="40" height="38" rx="5" fill="url(#tz-can)" stroke-width="4"/>
    <rect x="282" y="68" width="48" height="9" rx="3" fill="#b7c2cc" stroke-width="3.5"/>
    <rect x="288" y="92" width="22" height="6" fill="#1b1410" stroke="none"/>
    <circle cx="295" cy="95" r="2.5" fill="#ff4a3a" stroke="none"/>
  </g>
  <!-- XP gems and a muzzle spark -->
  <g stroke="#0a3a2a" stroke-width="2"><path d="M230 186 l5 -8 l5 8 l-5 8 z" fill="#5affc8"/><path d="M246 196 l4 -6 l4 6 l-4 6 z" fill="#5affc8"/></g>
  <circle cx="182" cy="147" r="5" fill="#ffe066"/>
</svg>
