<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="letters-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fb5a8"/>
      <stop offset="0.55" stop-color="#0e7f7d"/>
      <stop offset="1" stop-color="#0a3d4a"/>
    </linearGradient>
    <radialGradient id="letters-glow" cx="0.55" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#7ff5e3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7ff5e3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="letters-vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#021a20" stop-opacity="0"/>
      <stop offset="1" stop-color="#021a20" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="letters-face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="0.6" stop-color="#fff0d2"/>
      <stop offset="1" stop-color="#e7cf9f"/>
    </linearGradient>
    <linearGradient id="letters-bag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b74"/>
      <stop offset="1" stop-color="#b3202f"/>
    </linearGradient>
    <radialGradient id="letters-dial" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d5ecf0"/>
    </radialGradient>
    <linearGradient id="letters-case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="1" stop-color="#e0a800"/>
    </linearGradient>
    <g id="letters-tile">
      <rect x="-20" y="-16" width="40" height="40" rx="8" fill="#9a6b33" stroke="#3b2410" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="-20" y="-20" width="40" height="38" rx="8" fill="url(#letters-face)" stroke="#3b2410" stroke-width="3.5" stroke-linejoin="round"/>
      <rect x="-14" y="-15" width="18" height="5" rx="2.5" fill="#ffffff" opacity="0.8"/>
    </g>
  </defs>
  <rect width="400" height="240" fill="url(#letters-bg)"/>
  <rect width="400" height="240" fill="url(#letters-glow)"/>
  <!-- background dots -->
  <g fill="#ffffff" opacity="0.12">
    <circle cx="30" cy="40" r="6"/><circle cx="370" cy="30" r="9"/><circle cx="350" cy="200" r="7"/>
    <circle cx="60" cy="205" r="10"/><circle cx="330" cy="110" r="4"/><circle cx="20" cy="120" r="4"/>
  </g>
  <!-- speed lines -->
  <g stroke="#e8fffb" stroke-linecap="round" opacity="0.55">
    <path d="M10 70 H120" stroke-width="5"/>
    <path d="M30 96 H105" stroke-width="3"/>
    <path d="M0 150 H95" stroke-width="4"/>
    <path d="M300 60 H395" stroke-width="3"/>
    <path d="M320 205 H400" stroke-width="5"/>
  </g>
  <!-- floor shadow -->
  <ellipse cx="200" cy="192" rx="140" ry="12" fill="#02262c" opacity="0.4"/>
  <!-- bag -->
  <g stroke="#4a0d16" stroke-width="4" stroke-linejoin="round">
    <path d="M100 186 C88 160 96 128 118 112 L172 104 C192 124 198 160 186 186 Z" fill="url(#letters-bag)"/>
    <path d="M114 114 C130 98 156 96 176 104 C168 116 140 120 114 114 Z" fill="#7a1220"/>
    <path d="M118 112 C132 120 158 118 172 106" fill="none" stroke="#ffd23f" stroke-width="4"/>
  </g>
  <path d="M106 168 C102 148 108 132 120 124" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  <!-- bag drawstring tassel -->
  <path d="M122 114 C112 126 104 128 96 124" fill="none" stroke="#ffd23f" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="95" cy="124" r="5" fill="#ffd23f" stroke="#4a0d16" stroke-width="3"/>
  <!-- stopwatch -->
  <g stroke="#1b1030" stroke-width="4" stroke-linejoin="round">
    <rect x="273" y="66" width="18" height="14" rx="3" fill="url(#letters-case)"/>
    <rect x="266" y="58" width="32" height="11" rx="5" fill="#e63946"/>
    <path d="M314 88 l10 -10 l8 8 l-10 10 Z" fill="url(#letters-case)"/>
    <circle cx="282" cy="132" r="52" fill="url(#letters-case)"/>
    <circle cx="282" cy="132" r="41" fill="url(#letters-dial)"/>
  </g>
  <g stroke="#1b1030" stroke-linecap="round">
    <path d="M282 96 v7 M282 161 v7 M246 132 h7 M311 132 h7" stroke-width="4"/>
    <path d="M257 107 l4 4 M307 107 l-4 4 M257 157 l4 -4 M307 157 l-4 -4" stroke-width="3"/>
  </g>
  <path d="M282 132 L282 104 A28 28 0 0 1 307 120 Z" fill="#e63946" opacity="0.35"/>
  <path d="M282 132 L304 118" stroke="#e63946" stroke-width="5" stroke-linecap="round"/>
  <path d="M282 132 L282 112" stroke="#1b1030" stroke-width="5" stroke-linecap="round"/>
  <circle cx="282" cy="132" r="6" fill="#1b1030"/>
  <path d="M248 112 A40 40 0 0 1 266 94" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  <!-- motion swooshes behind tiles -->
  <g fill="none" stroke="#ffd23f" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <path d="M170 98 C176 82 186 72 196 66"/>
    <path d="M182 120 C196 112 210 110 220 112"/>
  </g>
  <!-- tiles -->
  <use href="#letters-tile" transform="translate(150 162) rotate(-6)"/>
  <use href="#letters-tile" transform="translate(194 160) rotate(8)"/>
  <use href="#letters-tile" transform="translate(214 82) rotate(-18)"/>
  <use href="#letters-tile" transform="translate(236 128) rotate(14) scale(0.95)"/>
  <use href="#letters-tile" transform="translate(166 74) rotate(22) scale(0.85)"/>
  <!-- tile patterns (shapes, no letters) -->
  <g fill="#13897e">
    <g transform="translate(150 162) rotate(-6)"><path d="M0 -12 L10 -1 L0 10 L-10 -1 Z"/><circle cx="12" cy="11" r="2.5"/></g>
    <g transform="translate(194 160) rotate(8)"><circle cx="0" cy="-1" r="9" fill="none" stroke="#13897e" stroke-width="5"/><circle cx="12" cy="11" r="2.5"/></g>
    <g transform="translate(214 82) rotate(-18)"><path d="M0 -13 l3.5 8 l8.5 1 l-6.5 6 l2 8.5 l-7.5 -4.5 l-7.5 4.5 l2 -8.5 l-6.5 -6 l8.5 -1 Z" fill="#e63946"/></g>
    <g transform="translate(236 128) rotate(14) scale(0.95)"><path d="M-10 -9 h20 v6 h-20 Z M-10 3 h20 v6 h-20 Z"/><circle cx="12" cy="11" r="2.5"/></g>
    <g transform="translate(166 74) rotate(22) scale(0.85)"><path d="M-11 -1 h22" stroke="#13897e" stroke-width="6" stroke-linecap="round"/></g>
  </g>
  <!-- sparkles -->
  <g fill="#fff6c8" stroke="#1b1030" stroke-width="2.5" stroke-linejoin="round">
    <path d="M246 72 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 Z"/>
    <path d="M128 76 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z"/>
  </g>
  <rect width="400" height="240" fill="url(#letters-vig)"/>
</svg>
