  <path d="M178 96C178 120 188 134 200 134C212 134 222 120 222 96Z" fill="#2a0d26" stroke="#1b1030" stroke-width="4" stroke-linejoin="round"/>
  <path d="M176 104C186 98 214 98 224 104C222 114 208 116 200 110C192 116 178 114 176 104Z" fill="#c41f45" stroke="#1b1030" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="188" cy="106" rx="5" ry="3" fill="#ffe14d"/>
  <ellipse cx="212" cy="106" rx="5" ry="3" fill="#ffe14d"/>
  <path d="M182 92C182 70 190 62 200 62C210 62 218 70 218 92Z" fill="#3a1640" stroke="#1b1030" stroke-width="4" stroke-linejoin="round"/>
  <path d="M183 86h34" stroke="#c41f45" stroke-width="6"/>
  <ellipse cx="200" cy="93" rx="38" ry="8" fill="#3a1640" stroke="#1b1030" stroke-width="4"/>
  <path d="M188 70C192 66 196 65 200 65" stroke="#8a4a9a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- table and dagger -->
  <path d="M-10 196H410V250H-10Z" fill="url(#mafia-wood)" stroke="#1b1030" stroke-width="4"/>
  <path d="M-10 206H410" stroke="#b86a3a" stroke-width="3" opacity="0.6"/>
  <path d="M40 222h60M150 230h50M300 224h70" stroke="#2a0d14" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <g transform="rotate(14 276 196)">
    <path d="M269 156H283V199H269Z" fill="url(#mafia-blade)" stroke="#1b1030" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M273 162V194" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    <rect x="258" y="150" width="36" height="9" rx="4" fill="#ffd166" stroke="#1b1030" stroke-width="3.5"/>
    <rect x="270" y="122" width="12" height="29" rx="5" fill="#5c0619" stroke="#1b1030" stroke-width="3.5"/>
