<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="mafia-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a1c"/>
      <stop offset="0.6" stop-color="#5e1432"/>
      <stop offset="1" stop-color="#a3244c"/>
    </linearGradient>
    <radialGradient id="mafia-moon" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffb08a"/>
      <stop offset="0.55" stop-color="#ff5a5a"/>
      <stop offset="1" stop-color="#c41f45"/>
    </radialGradient>
    <radialGradient id="mafia-moonglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff4f6e" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff4f6e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mafia-lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd86a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffb21f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mafia-wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4a2a"/>
      <stop offset="1" stop-color="#4a2014"/>
    </linearGradient>
    <linearGradient id="mafia-blade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f2ff"/>
      <stop offset="1" stop-color="#9a94b8"/>
    </linearGradient>
    <linearGradient id="mafia-coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1640"/>
      <stop offset="1" stop-color="#1b1030"/>
    </linearGradient>
    <radialGradient id="mafia-vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#mafia-sky)"/>
  <!-- stars -->
  <g fill="#ffd0e4" opacity="0.8">
    <circle cx="40" cy="30" r="1.8"/><circle cx="92" cy="58" r="1.4"/><circle cx="322" cy="26" r="2"/>
    <circle cx="368" cy="70" r="1.5"/><circle cx="130" cy="20" r="1.3"/><circle cx="276" cy="48" r="1.4"/>
  </g>
  <!-- moon -->
  <circle cx="200" cy="96" r="92" fill="url(#mafia-moonglow)"/>
  <circle cx="200" cy="96" r="54" fill="url(#mafia-moon)" stroke="#6e0f2c" stroke-width="4"/>
  <circle cx="182" cy="80" r="9" fill="#e8364f" opacity="0.5"/>
  <circle cx="222" cy="116" r="6" fill="#e8364f" opacity="0.5"/>
