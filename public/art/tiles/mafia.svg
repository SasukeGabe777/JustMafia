  <path d="M97 92h30l-6-10h-18z" fill="#3a1640" stroke="#1b1030" stroke-width="4" stroke-linejoin="round"/>
  <path d="M107 96v20" stroke="#fffaf0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
