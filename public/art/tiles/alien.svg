    <path d="M-56 -28 C-62 -32 -66 -28 -62 -22 Z M-28 -30 C-22 -34 -18 -30 -22 -24 Z" fill="#ffffff"/>
    <rect x="-58" y="-34" width="34" height="38" rx="14" fill="#ffffff"/>
    <rect x="-60" y="-8" width="38" height="20" rx="10" fill="#ffb0c8"/>
    <ellipse cx="-49" cy="2" rx="3" ry="4" fill="#7a2a4a" stroke="none"/>
    <ellipse cx="-34" cy="2" rx="3" ry="4" fill="#7a2a4a" stroke="none"/>
    <circle cx="-48" cy="-20" r="6" fill="#ffffff"/>
    <circle cx="-34" cy="-20" r="6" fill="#ffffff"/>
    <circle cx="-48" cy="-20" r="2.5" fill="#1b1030" stroke="none"/>
    <circle cx="-34" cy="-20" r="2.5" fill="#1b1030" stroke="none"/>
    <path d="M-50 -4 h18" fill="none" stroke="none"/>
  </g>
  <!-- surprise marks -->
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round">
    <path d="M136 118 l-10 -6 M134 132 l-12 0 M140 104 l-6 -9"/>
  </g>
  <g transform="translate(0 8)">
  <!-- UFO -->
  <ellipse cx="200" cy="100" rx="40" ry="8" fill="#7dff6a" opacity="0.6"/>
  <path d="M168 76 C168 50 232 50 232 76 Z" fill="url(#alien-dome)" stroke="#1d1036" stroke-width="4" stroke-linejoin="round"/>
  <path d="M182 64 C186 58 194 56 200 56" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <ellipse cx="200" cy="82" rx="78" ry="18" fill="url(#alien-hull)" stroke="#1d1036" stroke-width="4"/>
  <path d="M136 80 C160 74 240 74 264 80" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <ellipse cx="200" cy="94" rx="36" ry="7" fill="#4a3f7a" stroke="#1d1036" stroke-width="3.5"/>
  <g stroke="#1d1036" stroke-width="2.5">
    <circle cx="146" cy="86" r="4.5" fill="#ffd23f"/>
    <circle cx="172" cy="90" r="4.5" fill="#ff5aa0"/>
    <circle cx="228" cy="90" r="4.5" fill="#5ae0ff"/>
    <circle cx="254" cy="86" r="4.5" fill="#ffd23f"/>
