<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="alien-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14062e"/>
      <stop offset="0.6" stop-color="#3a1670"/>
      <stop offset="1" stop-color="#5a2a8a"/>
    </linearGradient>
    <linearGradient id="alien-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8ff9e" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7dff6a" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="alien-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dff6a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7dff6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="alien-hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1eefc"/>
      <stop offset="0.5" stop-color="#b6aed6"/>
      <stop offset="1" stop-color="#6c62a0"/>
    </linearGradient>
    <radialGradient id="alien-dome" cx="0.38" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#eaffe0"/>
      <stop offset="0.5" stop-color="#7dff6a"/>
      <stop offset="1" stop-color="#2f8a2a"/>
    </radialGradient>
    <radialGradient id="alien-vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#05021a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05021a" stop-opacity="0.7"/>
    </radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#alien-bg)"/>
  <!-- stars -->
  <g fill="#ffffff">
