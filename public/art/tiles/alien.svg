    <circle cx="300" cy="20" r="2"/><circle cx="350" cy="70" r="1.5"/><circle cx="370" cy="130" r="2"/><circle cx="330" cy="40" r="1.5"/>
    <circle cx="270" cy="60" r="1.5"/><circle cx="20" cy="160" r="1.5"/><circle cx="388" cy="20" r="1.5"/>
  </g>
  <g fill="#fff6c8" stroke="#1d1036" stroke-width="1.5">
    <path d="M100 80 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z"/>
    <path d="M318 98 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 Z"/>
  </g>
  <!-- ringed planet -->
