<body>
  <div class="offline" id="offline" hidden>Reconnecting…</div>
  <section class="ph ph-join" id="join" hidden>
    <h1>Just<span style="color:var(--pink)">Game</span><span style="color:var(--yellow)">Box</span></h1>
    <div class="game" id="j-game"></div>
    <div class="j-event" data-season-banner="compact" hidden></div> <!-- the seasonal event (public/progress-ui.js) -->
    <label for="j-code">Room code</label>
    <input id="j-code" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABCD">
    <label for="j-name">Your name</label>
    <input id="j-name" maxlength="14" autocomplete="nickname" placeholder="Name">
    <label>Pick your avatar</label>
    <div class="j-av" id="j-av"></div>
    <div class="j-busy" id="j-busy" hidden><p id="j-busy-msg"></p><button class="btn big green" id="j-next">🎮 Play next game</button><button class="btn big ghost" id="j-watch">👀 Watch as audience</button><small>Next-game players watch until the next lobby, then join in by themselves.</small></div>
    <button class="btn big" id="j-go">Join</button>
    <button class="link j-watch-link" id="j-watch2">👀 Just watch (join the audience)</button>
    <p class="err" id="j-err"></p>
  </section>
  <section class="ph" id="game" hidden>
    <div class="ph-head"><span id="h-game"></span><button class="h-me" id="h-me" title="You: avatar, sounds, leave"><span id="h-av"></span><b id="h-name"></b></button><span class="right"><button class="hbtn" id="h-react" title="React on the TV">😀</button><button class="hbtn" id="h-prof" title="My profile">🏆</button><button class="hbtn" id="h-help" title="How to play">❓</button><button class="hbtn" id="h-menu" title="Host menu" hidden>⚙️</button></span></div>
    <div class="react-tray" id="react-tray" hidden></div>
    <div id="vip-bar" class="vip-bar" hidden></div>
    <div id="party-bar" class="party-bar" hidden></div>
    <div id="g-body"></div>
  </section>
  <div class="sheet-bg" id="sheet-bg" hidden></div><div class="ph-sheet" id="ph-sheet" hidden></div>
  <div class="toast" id="toast" hidden></div>
  <script src="/socket.io/socket.io.js"></script>
